<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Register for The Meta Ads Creative Strategy Workshop — Thursday, October 15, 2026, 7:00 PM PHT, live on Zoom.">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<title>Register — The Meta Ads Creative Strategy Workshop</title>

<!-- ===========================================================
     TWO VALUES TO FILL, and the page says so on screen until
     both are done, so it cannot be shipped half-wired:

       PASTE_FORM_ENDPOINT_HERE   where the name and email are sent
       PASTE_CHECKOUT_URL_HERE    where the person goes afterwards

     A static page cannot store a lead by itself. The form posts to
     a service (Systeme.io, Formspree, Basin) which saves the row and
     then forwards to the checkout URL in the hidden _next field.

       sed -i 's|PASTE_FORM_ENDPOINT_HERE|https://...|g; \
               s|PASTE_CHECKOUT_URL_HERE|https://checkout.xendit.co/od/...|g' register.html
     =========================================================== -->
<style>

/* ============================================================
   CSI Batch 3 — one committed visual world (volt / ink / paper).
   Single theme on purpose; every colour is painted explicitly.
   ============================================================ */
:root{
  --ink:#111113;
  --ink-2:#1d1d20;
  /* Named --volt from the yellow this page started on. It now holds the
     purple, and every rule reads the token, so the name is historical
     only. Kept so this file and the Systeme.io blocks stay in step. */
  --volt:#a78bfa;
  --volt-deep:#8b5cf6;
  --paper:#fbf9f2;
  --paper-2:#f2efe3;
  --slate:#56524a;
  --ph:#c4006b;            /* placeholder marker — deliberately outside the palette */
  --go:#1c7a4b;
  --no:#c4402a;

  --col:1080px;
  --r:14px;
  --plate:6px;

  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;

  --step--1:clamp(.78rem,.75rem + .15vw,.85rem);
  --step-0:clamp(1rem,.96rem + .2vw,1.08rem);
  --step-1:clamp(1.12rem,1.02rem + .45vw,1.32rem);
  --step-2:clamp(1.4rem,1.2rem + .9vw,1.9rem);
  --step-3:clamp(1.9rem,1.5rem + 1.9vw,3rem);
  --step-4:clamp(2.4rem,1.7rem + 3.3vw,4.4rem);
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:var(--step-0);line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;letter-spacing:-.015em;text-wrap:balance;margin:0}
p{margin:0;max-width:65ch}
ul{margin:0;padding:0;list-style:none}
a{color:inherit}
strong,b{font-weight:700}
img{max-width:100%;height:auto;display:block}

:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4px}
.band-ink :focus-visible,.sticky-cta :focus-visible{outline-color:var(--volt)}

.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.skip{position:absolute;left:-999px;top:0;z-index:100}
.skip:focus{left:12px;top:12px;background:var(--volt);color:var(--ink);padding:.7rem 1.1rem;border:2px solid var(--ink);border-radius:8px;font-weight:700}

/* --------------------------- placeholders ---------------------------- */
/* An unfilled value has to be findable on paper, ink and the accent
   alike. This magenta is far darker than the accent and reads as a
   different thing on every ground the page uses. */
.ph{
  display:inline-block;max-width:100%;overflow-wrap:anywhere;font-family:var(--mono);font-size:.82em;font-weight:700;
  background:var(--ph);color:#fff;border-radius:6px;
  padding:.1em .45em;letter-spacing:.02em;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;
}
.ph-block{
  display:block;font-family:var(--mono);font-size:.9rem;font-weight:700;
  color:var(--ph);background:#fff0f7;border:2px dashed var(--ph);
  border-radius:10px;padding:.85rem 1rem;
}

/* ------------------------------- shell ------------------------------- */
.wrap{width:100%;max-width:var(--col);margin-inline:auto;padding-inline:20px}
section[id]{scroll-margin-top:1rem}
.band{padding-block:clamp(3.25rem,8vw,5.5rem)}
.band-paper{background:var(--paper);color:var(--ink)}
.band-paper-2{background:var(--paper-2);color:var(--ink)}
.band-ink{background:var(--ink);color:var(--paper)}
.band-volt{background:var(--volt);color:var(--ink)}

.eyebrow{font-family:var(--mono);font-weight:700;font-size:var(--step--1);letter-spacing:.14em;text-transform:uppercase;margin:0 0 1rem}
.band-ink .eyebrow{color:var(--volt)}
.band-paper .eyebrow,.band-paper-2 .eyebrow{color:var(--slate)}

.head{margin-bottom:clamp(1.75rem,4vw,2.75rem)}
.head h2{font-size:var(--step-3)}
.prose{display:grid;gap:1.1rem;max-width:62ch}
.prose p{font-size:var(--step-1);line-height:1.6;color:var(--slate)}
.band-ink .prose p{color:#c9c5b8}
.prose .emph{font-weight:700}
.band-ink .prose .emph{color:var(--paper)}
.band-volt .prose p{color:#342151}
.prose .kicker{font-family:var(--display);font-size:var(--step-2);color:var(--ink);line-height:1.15;max-width:22ch}
.band-ink .prose .kicker{color:var(--volt)}

/* ------------------------------ buttons ------------------------------ */
.btn{
  display:inline-flex;align-items:center;gap:.55rem;
  font-family:var(--body);font-weight:700;font-size:var(--step-0);
  text-decoration:none;cursor:pointer;text-align:center;
  padding:.9rem 1.6rem;border-radius:999px;
  border:2px solid var(--ink);background:var(--volt);color:var(--ink);
  transition:transform .18s cubic-bezier(.2,.7,.3,1),
             background-color .18s ease, color .18s ease, border-color .18s ease;
}
/* On paper and volt grounds the button inverts to ink, which is the
   strongest signal available. On an ink ground that would make the
   primary CTA recede into the background, so those darken instead. */
.btn:hover{transform:translateY(-2px);background:var(--ink);color:var(--volt);border-color:var(--ink)}
.band-ink .btn:hover,.top .btn:hover,.sticky-cta .btn:hover{
  background:var(--volt-deep);color:var(--ink);border-color:var(--volt-deep);
}
.btn:active{transform:translateY(0)}
.btn-lg{padding:1.05rem 2rem;font-size:var(--step-1)}
.under{font-family:var(--mono);font-size:var(--step--1);color:var(--slate);margin-top:.85rem}
.under a{text-decoration:underline}
.band-ink .under{color:#8f8b7e}
.band-volt .under{color:#342151}

/* ------------------------------- header ------------------------------ */
.top{position:sticky;top:0;z-index:50;background:var(--ink);color:var(--paper);border-bottom:2px solid var(--ink)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding-block:.65rem}
.logo{display:flex;align-items:center;gap:.6rem;text-decoration:none;font-family:var(--display);font-size:.95rem;letter-spacing:-.01em;padding-block:.55rem}
.mark{width:26px;height:26px;flex:none;border-radius:7px;background:var(--volt);color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:.78rem}
.top nav{display:none;gap:1.5rem;font-size:.92rem}
.top nav a{text-decoration:none;color:#c9c5b8}
.top nav a:hover{color:var(--volt)}
.top .btn{padding:.5rem 1.05rem;font-size:.88rem;border-color:var(--volt)}
@media (min-width:900px){.top nav{display:flex}}
@media (max-width:560px){.top .btn{display:none}}

/* -------------------------------- hero ------------------------------- */
.hero{padding-block:clamp(2.75rem,7vw,5rem)}
.hero h1{font-size:var(--step-4);max-width:19ch;margin-bottom:0}
.hero .subhead{font-size:var(--step-1);line-height:1.55;color:#c9c5b8;max-width:58ch}
.hero .subhead strong{color:var(--paper)}
.badge{
  display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--mono);font-weight:700;font-size:var(--step--1);
  letter-spacing:.1em;text-transform:uppercase;
  background:var(--volt);color:var(--ink);
  padding:.4rem .85rem;border-radius:999px;margin-bottom:1.3rem;
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink)}
/* overrides the 65ch paragraph measure so it stays one line on desktop;
   it still wraps naturally on a phone, where one line cannot fit */
.trust{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:#8f8b7e;
  margin-top:.5rem;max-width:none}
.hero .btn{margin-top:1.8rem}

/* ------------------------------- cards ------------------------------- */
.grid{display:grid;gap:calc(var(--plate) + 1rem)}
@media (min-width:640px){.g-2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:900px){.g-4{grid-template-columns:repeat(2,1fr)}}
.tile{position:relative;display:flex}
.tile::before{content:"";position:absolute;inset:0;border-radius:var(--r);background:var(--ink);transform:translate(var(--plate),var(--plate))}
.band-ink .tile::before{background:var(--volt)}
.card{
  position:relative;flex:1;display:flex;flex-direction:column;gap:.6rem;
  background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);
  padding:1.5rem;transition:transform .22s cubic-bezier(.2,.7,.3,1);
}
.band-ink .card{background:var(--ink-2);border-color:var(--volt);color:var(--paper)}
.tile:hover .card,.tile:focus-within .card{transform:translate(-3px,-3px)}
.card h3{font-size:var(--step-1)}
.card p{color:var(--slate);font-size:.98rem}
.band-ink .card p{color:#c9c5b8}

/* ---------------------------- comparison ----------------------------- */
.compare{display:grid;gap:calc(var(--plate) + 1rem)}
@media (min-width:820px){.compare{grid-template-columns:1fr 1fr;align-items:start}}
.cmp-h{margin-bottom:.35rem}
.pill{
  display:inline-block;font-family:var(--mono);font-size:.78rem;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;
  padding:.28rem .7rem;border-radius:999px;border:2px solid currentColor;
}
.pill.go{color:var(--go)}
.pill.no{color:var(--no)}
.cmp{display:grid;gap:.95rem}
.cmp li{display:grid;grid-template-columns:auto 1fr;gap:.75rem;align-items:start;color:var(--slate);font-size:.98rem}
.sig{font-family:var(--mono);font-weight:700;line-height:1.6}
.sig.go{color:var(--go)}
.sig.no{color:var(--no)}

/* ------------------------------ outcomes ----------------------------- */
.checks{display:grid;gap:1rem}
@media (min-width:760px){.checks{grid-template-columns:repeat(2,1fr);gap:1.1rem 2.2rem}}
.checks li{display:grid;grid-template-columns:auto 1fr;gap:.85rem;align-items:start;font-size:1rem;color:#342151}
.tick{width:24px;height:24px;flex:none;border-radius:7px;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-size:.78rem;font-weight:700;margin-top:.2rem}

/* ----------------------------- curriculum ---------------------------- */
.mods{display:grid;gap:.85rem}
.mod{border:2px solid var(--ink);border-radius:var(--r);background:var(--paper);overflow:hidden}
.mod summary{cursor:pointer;list-style:none;padding:1.15rem 1.3rem;display:grid;gap:.3rem;transition:background-color .18s ease,color .18s ease}
/* Hover paints the whole row volt. Guarded by hover:hover so a tap on a
   phone does not leave a module stuck in the hover colour. */
@media (hover:hover){
  .mod summary:hover{background:var(--volt)}
  .mod summary:hover .mod-n,.mod summary:hover .mod-d{color:#342151}
}
.mod summary:focus-visible{background:var(--volt)}
.mod summary:focus-visible .mod-n,.mod summary:focus-visible .mod-d{color:#342151}
.mod summary::-webkit-details-marker{display:none}
.mod-n{font-family:var(--mono);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.mod-t{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-family:var(--display);font-size:var(--step-1);line-height:1.15}
.mod-t::after{content:"+";font-family:var(--mono);font-weight:700;color:var(--ink);font-size:1.3rem;line-height:1;flex:none}
.mod[open] .mod-t::after{content:"–"}
.mod-d{color:var(--slate);font-size:.97rem;max-width:60ch}
.mod ul{display:grid;gap:.55rem;padding:0 1.3rem 1.3rem;margin-top:-.15rem}
.mod li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;color:var(--slate);font-size:.97rem}
.mod li::before{content:"—";font-family:var(--mono);color:var(--ink)}

/* ------------------------------- pricing ----------------------------- */
/* The whole pricing section is centred: heading, card, and everything in
   the card except the included list, which reads badly centred because
   the eye loses the left edge it scans down. */
#pricing .head{text-align:center}
.price-wrap{display:grid;gap:calc(var(--plate) + 1.2rem);max-width:620px;margin-inline:auto}
.price-card{text-align:center}
.price-card p{margin-inline:auto}
.price-card .amount{justify-content:center}
.price-card .eb-row{justify-content:center}
.price-card .incl{text-align:left}
.price-card{padding:clamp(1.6rem,3vw,2.2rem)}
.was{font-family:var(--mono);font-size:var(--step-1);color:var(--slate);text-decoration:line-through;text-decoration-thickness:2px;font-variant-numeric:tabular-nums}
.amount{display:flex;align-items:baseline;gap:.7rem;flex-wrap:wrap;margin:.35rem 0 .6rem}
.amount b{font-family:var(--display);font-size:var(--step-4);line-height:1;font-variant-numeric:tabular-nums}
.amount .eb{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--slate)}
.save{display:inline-block;font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--volt);padding:.3rem .7rem;border-radius:999px}
.incl{display:grid;gap:.65rem;margin:1.5rem 0}
.incl li{display:grid;grid-template-columns:auto 1fr;gap:.7rem;font-size:.98rem;color:var(--slate)}
.incl li::before{content:"+";font-family:var(--mono);font-weight:700;color:var(--ink)}
.price-card .btn{align-self:center;margin-top:.4rem}

/* -------------------------------- about ------------------------------ */
.about{display:grid;gap:clamp(1.75rem,4vw,2.75rem)}
@media (min-width:820px){.about{grid-template-columns:320px 1fr;align-items:start}}
.photo{
  aspect-ratio:4/5;max-width:100%;border:2px solid var(--ink);border-radius:var(--r);
  background:var(--paper-2);display:grid;place-items:center;padding:1.25rem;text-align:center;
}
/* Drop an <img> in and the frame becomes the photo. The .filled class does the
   same job for browsers without :has(). */
.photo:has(img),.photo.filled{padding:0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block;border-radius:calc(var(--r) - 2px)}
/* A 4:5 portrait eats most of a phone screen before the bio starts, so it
   squares off on narrow screens. */
@media (max-width:560px){.photo{aspect-ratio:1/1}}
.cred{font-family:var(--mono);font-size:.78rem;letter-spacing:.06em;color:var(--slate);
  margin-top:1.4rem;padding-top:1rem;border-top:2px solid var(--ink);max-width:none;
  display:grid;gap:.5rem}
.cred li{display:grid;grid-template-columns:auto 1fr;gap:.6rem;line-height:1.5}
.cred li::before{content:"+";font-weight:700;color:var(--ink)}
.cred i{font-style:italic;color:var(--ink)}
/* ------------------------- as featured in ---------------------------- */
/* Two covers from someone else's brand world, so they sit in plain frames
   and stay small — a credit, not a banner. */
.feat{margin-top:1.6rem}
.feat-h{font-family:var(--mono);font-size:.78rem;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;color:var(--slate);margin-bottom:.85rem}
.feat-row{display:flex;flex-wrap:wrap;gap:1.1rem}
.feat-item{margin:0;width:150px;max-width:44%}
.feat-item img{width:100%;height:auto;border:2px solid var(--ink);border-radius:10px;background:var(--paper-2)}
.feat-item figcaption{font-family:var(--mono);font-size:.76rem;line-height:1.4;color:var(--slate);margin-top:.5rem}
.pull{
  font-family:var(--display);font-size:var(--step-2);line-height:1.2;
  border-left:6px solid var(--volt);padding-left:1.1rem;margin:.4rem 0;max-width:30ch;
}

/* ---------------------------- testimonials --------------------------- */
.quotes{display:grid;gap:1.2rem}
@media (min-width:820px){.quotes{grid-template-columns:repeat(3,1fr)}}
/* four quotes read better two-up than squeezed into four columns */
@media (min-width:760px){.quotes-2{grid-template-columns:repeat(2,1fr)}}
@media (min-width:820px){.quotes-2{grid-template-columns:repeat(2,1fr)}}
.who-av{display:grid;grid-template-columns:auto 1fr;gap:.8rem;align-items:center}
.av-img{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--ink);flex:none}
.quote{background:var(--paper);border:2px dashed var(--ph);border-radius:var(--r);padding:1.4rem;display:flex;flex-direction:column;gap:1rem}
.who-row{display:flex;align-items:center;gap:.7rem;margin-top:auto}
/* A filled quote is real copy, so it drops the dashed placeholder frame. */
.quote.filled{border:2px solid var(--ink)}
.quote.filled p{font-size:.95rem;line-height:1.6;color:var(--slate)}
.who{margin-top:auto;padding-top:.9rem;border-top:2px solid var(--paper-2)}
/* These sit inside .quote.filled p, so they have to out-specify it. */
.quote.filled .who p{max-width:none}
.quote.filled .who-name{font-family:var(--display);font-size:1.02rem;color:var(--ink);line-height:1.2}
.quote.filled .who-role{font-size:.82rem;color:var(--slate);line-height:1.45;margin-top:.2rem}
.quote.filled .who-meta{font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--slate);margin-top:.5rem}
.av{width:38px;height:38px;border-radius:50%;background:#fff0f7;border:2px dashed var(--ph);flex:none}

/* ------------------------- video testimonials ------------------------ */
.vids{display:grid;gap:calc(var(--plate) + 1rem)}
@media (min-width:820px){.vids{grid-template-columns:repeat(3,1fr)}}
.vid{margin:0;display:flex;flex-direction:column;gap:.7rem}
.vid-play{
  position:relative;display:grid;place-items:center;align-content:center;gap:.7rem;
  aspect-ratio:16/9;width:100%;max-width:100%;
  background:var(--ink);border:2px solid var(--ink);border-radius:var(--r);
  color:var(--paper);text-decoration:none;
  transition:transform .22s cubic-bezier(.2,.7,.3,1);
}
.vid-play:hover{transform:translateY(-3px)}
.vid-icon{
  width:54px;height:54px;border-radius:50%;background:var(--volt);color:var(--ink);
  display:grid;place-items:center;font-size:1.05rem;padding-left:4px;
}
.vid-label{font-family:var(--mono);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:#c9c5b8}
.vid-frame{width:100%;aspect-ratio:16/9;border:2px solid var(--ink);border-radius:var(--r);display:block;background:var(--ink)}
.vid figcaption{font-family:var(--mono);font-size:.78rem;color:var(--slate)}

/* --------------------------------- faq ------------------------------- */
.faq{display:grid;gap:.7rem;max-width:820px}
.faq details{background:var(--ink-2);border:2px solid #34343a;border-radius:12px}
.faq details[open]{border-color:var(--volt)}
.faq summary{cursor:pointer;list-style:none;padding:1.05rem 1.3rem;font-weight:700;display:flex;justify-content:space-between;gap:1rem;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-family:var(--mono);color:var(--volt);font-size:1.2rem;line-height:1;flex:none}
.faq details[open] summary::after{content:"–"}
.faq .a{padding:0 1.3rem 1.2rem;color:#c9c5b8;font-size:.98rem}

/* ----------------------------- final cta ----------------------------- */
.final{text-align:center}
.final h2{font-size:var(--step-3);margin-inline:auto;max-width:none;margin-bottom:1.35rem}
.final h2 span{display:block}
.final .prose{margin-inline:auto;text-align:center}
.final p{margin-inline:auto}
.price-line{font-family:var(--mono);font-weight:700;font-size:var(--step-0);margin-top:1.5rem;color:#342151}
.price-line s{text-decoration-thickness:2px}

/* ------------------------------- footer ------------------------------ */
.foot{background:var(--ink);color:#8f8b7e;padding-block:2.2rem;font-size:.88rem}
.disclaimer{
  scroll-margin-top:70px;max-width:72ch;padding-bottom:1.5rem;margin-bottom:1.5rem;
  border-bottom:1px solid #2c2c30;
}
.disclaimer b{
  display:block;margin-bottom:.4rem;color:var(--volt);
  font-family:var(--mono);font-size:.78rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;
}
.disclaimer p{color:#c9c5b8;font-size:.92rem;line-height:1.6}
.foot-in{display:flex;flex-wrap:wrap;gap:1rem;justify-content:space-between;align-items:center}
/* Footer links are the smallest targets on the page, so they carry their own
   padding to reach the ~44px a thumb needs. */
.foot-in a{display:inline-block;padding-block:.62rem}
.foot a{color:#c9c5b8;text-decoration:none}
.foot a:hover{color:var(--volt)}
.foot-contact a{color:var(--volt);text-decoration:none;border-bottom:1px solid rgba(167,139,250,.35)}

/* --------------------------- sticky mobile CTA ----------------------- */
.sticky-cta{
  display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--ink);border-top:2px solid var(--volt);
  /* the inset keeps the bar above the iPhone home indicator */
  padding:.7rem 16px calc(.7rem + env(safe-area-inset-bottom, 0px));
  gap:.9rem;align-items:center;justify-content:space-between;
}
.sticky-cta .p b{font-family:var(--display);color:var(--volt);font-size:1.15rem;display:block;line-height:1.1}
.sticky-cta .p span{font-family:var(--mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:#8f8b7e}
/* Wrapping the label would make the bar taller than the space reserved for it
   below, so the button stays on one line and shrinks its padding instead. */
.sticky-cta .btn{padding:.7rem 1.1rem;font-size:.92rem;border-color:var(--volt);white-space:nowrap;flex:none}
@media (max-width:780px){
  .sticky-cta{display:flex}
  body{padding-bottom:calc(104px + env(safe-area-inset-bottom, 0px))}
}
@media (max-width:400px){
  /* tighter bar on small phones: the price label needs two lines here, so the
     vertical padding gives some of it back */
  .sticky-cta{padding-block:.5rem;padding-inline:12px;gap:.6rem}
  .sticky-cta .p span{line-height:1.3}
  .sticky-cta .btn{padding:.65rem .9rem;font-size:.88rem}
}

/* ------------------------------- motion ------------------------------ */
/* Nothing is hidden unless JS is running and motion is allowed. */
.js .reveal{opacity:0;transform:translateY(18px)}
.js .reveal.is-in{opacity:1;transform:none;transition:opacity .55s ease,transform .55s cubic-bezier(.2,.7,.3,1);transition-delay:var(--d,0ms)}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .js .reveal{opacity:1;transform:none}
  .btn,.card{transition:none}
  .tile:hover .card,.tile:focus-within .card{transform:none}
}

/* ================ additions for the workshop page only ================
   Everything above is the shared design system, lifted from index.html
   so the two pages stay one brand. Only the blocks this page introduces
   are defined below.
   ====================================================================== */

/* --------------------------- the details card ------------------------ */
/* A label/value list inside the centred price card. The list itself is
   centred as a block but stays left-aligned inside, so the eye keeps the
   left edge it scans down. */
.facts{
  display:grid;gap:.85rem;margin:1.1rem 0 1.5rem;margin-inline:auto;
  text-align:left;width:fit-content;max-width:100%;
}
.facts li{display:grid;grid-template-columns:6.5rem 1fr;gap:.9rem;align-items:baseline;font-size:1rem;color:var(--slate)}
.facts .k{font-family:var(--mono);font-size:.74rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
/* Two columns of 6.5rem + text do not fit a small phone, so the label
   sits above its value there instead of squeezing it. */
@media (max-width:520px){.facts li{grid-template-columns:1fr;gap:.1rem}}

/* ------------------------- announcement bar -------------------------- */
/* The only thing above the hero now that the nav header is gone, so it
   carries the offer rather than links: one line, the whole strip clickable. */
.announce{
  display:flex;align-items:center;justify-content:center;gap:.6rem;flex-wrap:wrap;
  background:var(--volt);color:var(--ink);text-decoration:none;
  font-family:var(--mono);font-weight:700;font-size:var(--step--1);
  letter-spacing:.1em;text-transform:uppercase;
  padding:.7rem 20px;text-align:center;border-bottom:2px solid var(--ink);
}
.announce:hover{background:var(--volt-deep)}
.announce .go{font-weight:700}

/* --------------------------- module cards ---------------------------- */
/* The curriculum reads as six objects rather than a list to open, so the
   evening looks like six things you get and not one more accordion. */
.mod-grid{display:grid;gap:calc(var(--plate) + 1rem)}
@media (min-width:700px){.mod-grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:1000px){.mod-grid{grid-template-columns:repeat(3,1fr)}}
.mod-card .m-n{font-family:var(--mono);font-weight:700;font-size:.74rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--slate)}
.mod-card h3{font-size:var(--step-1);margin-top:.15rem}
.mod-card .m-x{margin-top:auto;padding-top:.9rem;border-top:2px solid var(--paper-2);
  font-size:.9rem;color:var(--slate)}
.mod-card .m-x b{display:block;font-family:var(--mono);font-size:.72rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink);margin-bottom:.25rem}

/* --------------------------- scarcity band --------------------------- */
/* A real limit, stated once. No countdown, no invented price rise. */
.scarce{text-align:center}
.scarce .chip{display:inline-flex;align-items:center;gap:.5rem;
  font-family:var(--mono);font-weight:700;font-size:var(--step--1);
  letter-spacing:.12em;text-transform:uppercase;
  background:var(--volt);color:var(--ink);padding:.4rem .9rem;border-radius:999px;
  margin-bottom:1.1rem}
.scarce h2{font-size:var(--step-3);max-width:20ch;margin-inline:auto}
.scarce p{margin-inline:auto;margin-top:1rem;color:#c9c5b8;max-width:52ch}

/* -------------------------- centred hero ----------------------------- */
/* The hero is the one centred band on the page; everything below it stays
   left-aligned, so the centring reads as emphasis rather than a default.
   The measures stay as they are and the blocks are centred instead, so the
   line lengths that make the copy readable are not touched. */
.hero{text-align:center}
/* The title is the headline now, so the old headline sits under it as the
   thesis. Display face in volt, a step down, so it reads as the second beat
   rather than competing with the name above it. */
.hero .hero-line{font-family:var(--display);font-size:var(--step-2);line-height:1.15;
  color:var(--volt);max-width:26ch;margin:1.15rem auto 0}
.hero h1,.hero .subhead,.hero .trust{margin-inline:auto}

/* ------------------------------ one-liner ---------------------------- */
/* The single sentence that carries a section on its own. */
.solo{font-family:var(--display);font-size:var(--step-2);line-height:1.2;max-width:34ch;margin:0}
.band-ink .solo{color:var(--volt)}

/* ============== additions for the registration page only ==============
   Everything above is the workshop page's design system, lifted verbatim so
   the two pages are one brand. Only the form is new.
   ====================================================================== */

/* A registration page has one job, so it gets one centred column and
   nothing to click but the button. */
.reg-wrap{min-height:100%;display:grid;place-items:center;padding-block:clamp(2.5rem,7vw,4rem)}
.reg{width:100%;max-width:560px;margin-inline:auto;padding-inline:20px}
.reg-head{text-align:center;margin-bottom:clamp(1.5rem,4vw,2.25rem)}
.reg-head h1{font-size:var(--step-3);margin-bottom:.9rem}
.reg-head .lede{color:#c9c5b8;max-width:46ch;margin-inline:auto}

.card-form{
  background:var(--paper);border:2px solid var(--ink);border-radius:var(--r);
  padding:clamp(1.4rem,4vw,2rem);display:grid;gap:1.1rem;
}
.field{display:grid;gap:.4rem}
.field label{font-family:var(--mono);font-size:.74rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.field input{
  font-family:var(--body);font-size:var(--step-0);color:var(--ink);
  background:var(--paper-2);border:2px solid var(--ink);border-radius:10px;
  padding:.8rem .9rem;width:100%;
}
.field input::placeholder{color:#8f8b7e}
.field input:focus-visible{outline:3px solid var(--volt);outline-offset:2px}
/* A field that failed validation says so next to itself, not in a dialog. */
.field.bad input{border-color:var(--no)}
.field .err{font-size:.82rem;color:var(--no);min-height:0}
.field .err:empty{display:none}

.card-form .btn{width:100%;justify-content:center;margin-top:.3rem}
.fine{font-family:var(--mono);font-size:.74rem;line-height:1.6;color:var(--slate);text-align:center}
.when{
  display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;
  font-family:var(--mono);font-size:.76rem;letter-spacing:.06em;
  color:#8f8b7e;margin-top:1.2rem;text-align:center;
}
.back{display:block;text-align:center;margin-top:1.4rem;font-size:.86rem;color:#8f8b7e}
.back a{color:var(--volt);text-decoration:none;border-bottom:1px solid rgba(167,139,250,.35)}

/* Shown only while a placeholder is still in the file. It is deliberately
   loud: shipping this page unwired would collect nothing. */
.unwired{
  margin-bottom:1.4rem;border:2px dashed var(--ph);background:#fff0f7;color:#6b0038;
  border-radius:10px;padding:.9rem 1rem;font-size:.9rem;line-height:1.55;
}
.unwired b{display:block;font-family:var(--mono);font-size:.74rem;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ph);margin-bottom:.3rem}
.unwired code{font-family:var(--mono);font-size:.85em;background:#ffd9ec;
  padding:.05em .35em;border-radius:4px}
</style>
</head>
<body class="band-ink">
<a class="skip" href="#reg-form">Skip to the form</a>

<main class="reg-wrap">
  <div class="reg">

    <div class="unwired" id="unwired" hidden>
      <b>Not connected yet</b>
      <span id="unwired-text"></span>
    </div>

    <div class="reg-head">
      <h1>Save your seat</h1>
      <p class="lede">Name and email, then payment on the next step.</p>
    </div>

    <form class="card-form" id="reg-form" method="POST"
          action="PASTE_FORM_ENDPOINT_HERE" novalidate>
      <!-- the form service sends people here once the row is saved -->
      <input type="hidden" name="_next" value="PASTE_CHECKOUT_URL_HERE">
      <input type="hidden" name="_subject" value="Workshop registration">
      <!-- a bot trap: real people never fill a field they cannot see -->
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off"
             style="position:absolute;left:-9999px" aria-hidden="true">

      <div class="field" id="f-name">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name"
               placeholder="Juan dela Cruz" required>
        <p class="err" id="e-name" aria-live="polite"></p>
      </div>

      <div class="field" id="f-email">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email"
               inputmode="email" placeholder="you@example.com" required>
        <p class="err" id="e-email" aria-live="polite"></p>
      </div>

      <button class="btn btn-lg" type="submit">Save my seat</button>

    </form>

    <p class="when">
      <span>Thursday, 15 October 2026</span>
      <span aria-hidden="true">&middot;</span>
      <span>7:00 PM PHT</span>
      <span aria-hidden="true">&middot;</span>
      <span>Live on Zoom</span>
    </p>

    <p class="back"><a href="masterclass.html">Back to the workshop details</a></p>
  </div>
</main>

<script>
(function () {
  "use strict";
  var form  = document.getElementById("reg-form");
  var nameI = document.getElementById("name");
  var mailI = document.getElementById("email");

  // Both values are still placeholders until someone fills them. Rather than
  // fail silently at the worst possible moment, say so on the page and refuse
  // to pretend the funnel works.
  var endpoint = form.getAttribute("action") || "";
  var next     = form.querySelector('[name="_next"]').value || "";
  var missing  = [];
  if (endpoint.indexOf("PASTE_") === 0) missing.push("the form endpoint, so nothing is saved");
  if (next.indexOf("PASTE_") === 0)     missing.push("the checkout link, so there is nowhere to send people");
  if (missing.length) {
    var box = document.getElementById("unwired");
    document.getElementById("unwired-text").textContent =
      "This page is still missing " + missing.join(", and ") +
      ". Fill PASTE_FORM_ENDPOINT_HERE and PASTE_CHECKOUT_URL_HERE in register.html before sending traffic here.";
    box.hidden = false;
  }

  function setErr(wrapId, errId, msg) {
    document.getElementById(wrapId).classList.toggle("bad", !!msg);
    document.getElementById(errId).textContent = msg || "";
    return !msg;
  }
  // Deliberately permissive: something@something.something. Anything stricter
  // rejects real addresses, and the only real test is whether the mail arrives.
  function emailLooksReal(v) { return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v); }

  function validate() {
    var okName  = setErr("f-name",  "e-name",
      nameI.value.trim() ? "" : "Please enter your name.");
    var v = mailI.value.trim();
    var okEmail = setErr("f-email", "e-email",
      !v ? "Please enter your email address."
         : (emailLooksReal(v) ? "" : "That does not look like an email address."));
    return okName && okEmail;
  }

  nameI.addEventListener("input", function () { setErr("f-name", "e-name", ""); });
  mailI.addEventListener("input", function () { setErr("f-email", "e-email", ""); });

  form.addEventListener("submit", function (event) {
    if (!validate()) {
      event.preventDefault();
      (document.querySelector(".field.bad input") || nameI).focus();
      return;
    }
    if (missing.length) {
      event.preventDefault();
      document.getElementById("unwired").scrollIntoView({ block: "center" });
      return;
    }
    // Let the POST go. The form service saves the row, then redirects to _next.
  });
})();
</script>
</body>
</html>
