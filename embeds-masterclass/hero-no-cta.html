<!-- Creative Strategy Workshop — Hero, no CTA (for a page that has its own action) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Scoped to .csi and forced with !important, so the page builder's own
   styles cannot reach inside this block. */
.csi-hero{all:initial!important;display:block!important;}
.csi-hero,.csi-hero *,.csi-hero *::before,.csi-hero *::after{box-sizing:border-box!important;}
.csi-hero *{color:inherit!important;background:none!important;font-family:inherit!important;
  letter-spacing:normal!important;font-style:normal!important;text-transform:none!important;
  text-shadow:none!important;float:none!important;text-decoration:none!important;}
.csi-hero p,.csi-hero span,.csi-hero div{font-size:inherit!important;line-height:inherit!important;}
.csi-hero{
  --ink:#111113!important; --paper:#fbf9f2!important; --volt:#a78bfa!important;
  --display:"Archivo Black","Arial Black",Impact,sans-serif!important;
  --body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace!important;
}
.csi-hero{margin:0!important;background:var(--ink)!important;color:var(--paper)!important;
  font-family:var(--body)!important;font-size:clamp(1rem,.96rem + .2vw,1.08rem)!important;
  line-height:1.65!important;-webkit-font-smoothing:antialiased!important;
  text-align:center!important;
  padding:clamp(2.75rem,7vw,5rem) 20px clamp(1.5rem,3vw,2rem)!important;}
/* break out of the builder's centred column so the dark ground is full width */
html{overflow-x:clip!important;}
.csi-hero{width:100vw!important;max-width:100vw!important;margin-inline:calc(50% - 50vw)!important;}

.csi-hero .in{width:100%!important;max-width:1080px!important;margin:0 auto!important;}

.csi-hero .badge{display:inline-flex!important;align-items:center!important;gap:.5rem!important;
  font-family:var(--mono)!important;font-weight:700!important;
  font-size:clamp(.78rem,.75rem + .15vw,.85rem)!important;letter-spacing:.1em!important;
  text-transform:uppercase!important;background:var(--volt)!important;color:var(--ink)!important;
  padding:.4rem .85rem!important;border-radius:999px!important;margin:0 0 1.3rem!important;}
.csi-hero .dot{width:7px!important;height:7px!important;border-radius:50%!important;
  background:var(--ink)!important;display:inline-block!important;}

.csi-hero h1{font-family:var(--display)!important;font-weight:400!important;line-height:1.05!important;
  letter-spacing:-.015em!important;font-size:clamp(2.4rem,1.7rem + 3.3vw,4.4rem)!important;
  margin:0 auto!important;max-width:19ch!important;color:var(--paper)!important;
  text-wrap:balance!important;}

.csi-hero .line{font-family:var(--display)!important;
  font-size:clamp(1.4rem,1.2rem + .9vw,1.9rem)!important;line-height:1.15!important;
  color:var(--volt)!important;max-width:26ch!important;margin:1.15rem auto 0!important;}

.csi-hero .when{font-family:var(--mono)!important;font-size:.78rem!important;
  letter-spacing:.06em!important;color:#8f8b7e!important;margin:1.6rem 0 0!important;
  line-height:1.6!important;}
</style>

<div class="csi-hero">
  <div class="in">
    <p class="badge"><span class="dot" aria-hidden="true"></span>Live workshop &middot; 15 October 2026</p>
    <h1>Ad Creative Strategy Workshop</h1>
    <p class="line">Meta automated the targeting. The only lever left is creative.</p>
    <p class="when">Thursday, October 15, 2026 &middot; 5:00 PM PHT &middot; Live on Zoom</p>
  </div>
</div>
