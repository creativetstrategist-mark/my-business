<!-- Creative Strategy Workshop — Registration page (its own page, not the landing page) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Everything is scoped to .csi and forced with !important, so the page
   builder's own styles cannot reach inside this block. */
.csi{all:initial!important;display:block!important;}
.csi,.csi *,.csi *::before,.csi *::after{box-sizing:border-box!important;}
.csi *{color:inherit!important;background:none!important;font-family:inherit!important;
  letter-spacing:normal!important;font-style:normal!important;text-transform:none!important;
  text-shadow:none!important;float:none!important;text-decoration:none!important;}
.csi p,.csi span,.csi div,.csi label,.csi form{font-size:inherit!important;line-height:inherit!important;}
.csi{
  --ink:#111113!important; --paper:#fbf9f2!important; --paper-2:#f2efe3!important;
  --slate:#56524a!important; --volt:#a78bfa!important; --volt-deep:#8b5cf6!important;
  --no:#c4402a!important; --ph:#c4006b!important;
  --display:"Archivo Black","Arial Black",Impact,sans-serif!important;
  --body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif!important;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace!important;
}
.csi{margin:0!important;background:var(--ink)!important;color:var(--paper)!important;
  font-family:var(--body)!important;font-size:clamp(1rem,.96rem + .2vw,1.08rem)!important;
  line-height:1.65!important;-webkit-font-smoothing:antialiased!important;
  padding:clamp(1.5rem,3vw,2rem) 20px clamp(2.5rem,7vw,4rem)!important;}
/* break out of the builder's centred column so the dark ground is full width */
html{overflow-x:clip!important;}
.csi{width:100vw!important;max-width:100vw!important;margin-inline:calc(50% - 50vw)!important;}

.csi .reg{width:100%!important;max-width:560px!important;margin:0 auto!important;}
.csi .reg-head{text-align:center!important;margin:0 0 clamp(1.5rem,4vw,2.25rem)!important;}
.csi h2{font-family:var(--display)!important;font-weight:400!important;line-height:1.1!important;
  letter-spacing:-.015em!important;font-size:clamp(1.5rem,1.25rem + 1vw,2.1rem)!important;
  margin:0 0 .7rem!important;color:var(--paper)!important;}
.csi .lede{color:#c9c5b8!important;margin:0 auto!important;max-width:42ch!important;
  font-size:clamp(1rem,.96rem + .2vw,1.08rem)!important;line-height:1.65!important;}

.csi form{background:var(--paper)!important;border:2px solid var(--ink)!important;
  border-radius:14px!important;padding:clamp(1.4rem,4vw,2rem)!important;
  display:grid!important;gap:1.1rem!important;margin:0!important;}
.csi .field{display:grid!important;gap:.4rem!important;}
.csi label{font-family:var(--mono)!important;font-size:.74rem!important;font-weight:700!important;
  letter-spacing:.12em!important;text-transform:uppercase!important;color:var(--ink)!important;
  display:block!important;margin:0!important;}
/* Each property is restated because the reset above strips background and
   colour from every descendant; without these the fields render invisible. */
.csi input{font-family:var(--body)!important;font-size:1rem!important;line-height:1.4!important;
  color:var(--ink)!important;background:var(--paper-2)!important;border:2px solid var(--ink)!important;
  border-radius:10px!important;padding:.8rem .9rem!important;width:100%!important;max-width:100%!important;
  height:auto!important;margin:0!important;box-shadow:none!important;
  -webkit-appearance:none!important;appearance:none!important;}
.csi input::placeholder{color:#8f8b7e!important;opacity:1!important;}
.csi input:focus-visible{outline:3px solid var(--volt)!important;outline-offset:2px!important;}
.csi .field.bad input{border-color:var(--no)!important;}
.csi .err{font-size:.82rem!important;color:var(--no)!important;margin:0!important;}
.csi .err:empty{display:none!important;}

.csi button{display:inline-flex!important;align-items:center!important;justify-content:center!important;
  width:100%!important;font-family:var(--body)!important;font-weight:700!important;
  font-size:clamp(1.12rem,1.02rem + .45vw,1.32rem)!important;cursor:pointer!important;
  padding:1.05rem 2rem!important;border-radius:999px!important;border:2px solid var(--ink)!important;
  background:var(--volt)!important;color:var(--ink)!important;margin:.3rem 0 0!important;
  text-align:center!important;-webkit-appearance:none!important;appearance:none!important;
  transition:background-color .18s ease,transform .18s ease!important;}
.csi button:hover{background:var(--volt-deep)!important;transform:translateY(-2px)!important;}
.csi button:active{transform:translateY(0)!important;}


/* Shown only while the two values below are unfilled. */
.csi .unwired{margin:0 0 1.4rem!important;border:2px dashed var(--ph)!important;
  background:#fff0f7!important;color:#6b0038!important;border-radius:10px!important;
  padding:.9rem 1rem!important;font-size:.9rem!important;line-height:1.55!important;}
.csi .unwired b{display:block!important;font-family:var(--mono)!important;font-size:.74rem!important;
  font-weight:700!important;letter-spacing:.12em!important;text-transform:uppercase!important;
  color:var(--ph)!important;margin:0 0 .3rem!important;}
@media (prefers-reduced-motion:reduce){.csi button{transition:none!important;}}
</style>

<div class="csi">
  <div class="reg">

    <div class="unwired" id="unwired" hidden><b>Not connected yet</b><span id="unwired-text"></span></div>

    <div class="reg-head">
      <h2>Save your seat</h2>
      <p class="lede">Name and email, then payment on the next step.</p>
    </div>

    <!-- FILL THESE TWO:
         action="..."        where the name and email are sent
         _next value="..."   where the person goes afterwards          -->
    <form id="reg-form" method="POST" action="PASTE_FORM_ENDPOINT_HERE" novalidate>
      <input type="hidden" name="_next" value="PASTE_CHECKOUT_URL_HERE">
      <input type="hidden" name="_subject" value="Workshop registration">
      <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true"
             style="position:absolute;left:-9999px">

      <div class="field" id="f-name">
        <label for="name">Your name</label>
        <input id="name" name="name" type="text" autocomplete="name" placeholder="Juan dela Cruz" required>
        <p class="err" id="e-name" aria-live="polite"></p>
      </div>

      <div class="field" id="f-email">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email"
               placeholder="you@example.com" required>
        <p class="err" id="e-email" aria-live="polite"></p>
      </div>

      <button type="submit">Save my seat</button>
    </form>

  </div>
</div>

<script>
(function () {
  "use strict";
  var form = document.getElementById("reg-form");
  if (!form || form.getAttribute("data-reg")) return;
  form.setAttribute("data-reg", "1");
  var nameI = document.getElementById("name"), mailI = document.getElementById("email");

  // Say so on the page rather than failing silently at the worst moment.
  var missing = [];
  if ((form.getAttribute("action") || "").indexOf("PASTE_") === 0) missing.push("the form endpoint, so nothing is saved");
  if ((form._next.value || "").indexOf("PASTE_") === 0) missing.push("the checkout link, so there is nowhere to send people");
  if (missing.length) {
    document.getElementById("unwired-text").textContent =
      " This block is still missing " + missing.join(", and ") + ".";
    document.getElementById("unwired").hidden = false;
  }

  function setErr(wrap, err, msg) {
    document.getElementById(wrap).classList.toggle("bad", !!msg);
    document.getElementById(err).textContent = msg || "";
    return !msg;
  }
  function validate() {
    var ok1 = setErr("f-name", "e-name", nameI.value.trim() ? "" : "Please enter your name.");
    var v = mailI.value.trim();
    var ok2 = setErr("f-email", "e-email", !v ? "Please enter your email address."
      : (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) ? "" : "That does not look like an email address."));
    return ok1 && ok2;
  }
  nameI.addEventListener("input", function () { setErr("f-name", "e-name", ""); });
  mailI.addEventListener("input", function () { setErr("f-email", "e-email", ""); });
  form.addEventListener("submit", function (e) {
    if (!validate()) { e.preventDefault(); (document.querySelector(".field.bad input") || nameI).focus(); return; }
    if (missing.length) { e.preventDefault(); document.getElementById("unwired").scrollIntoView({block:"center"}); }
  });
})();
</script>
