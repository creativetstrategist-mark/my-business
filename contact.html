<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Business — Contact</title>
  <meta name="description" content="Get in touch with My Business.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="index.html">My&nbsp;Business</a>
      <button class="nav-toggle" aria-expanded="false" aria-controls="nav">
        <span class="sr-only">Menu</span>
        <span class="bars" aria-hidden="true"></span>
      </button>
      <nav id="nav" class="nav">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="page-head">
      <div class="wrap narrow">
        <h1>Contact</h1>
        <p class="lede">Tell us what you need. We reply within one business day.</p>
      </div>
    </section>

    <section class="section">
      <div class="wrap narrow">
        <!--
          This form posts nowhere by default. To make it work, either:
            1. Point `action` at a form service (Formspree, Basin, Netlify Forms), or
            2. Delete the form and keep the email link below.
        -->
        <form class="form" action="#" method="post" novalidate>
          <div class="field">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="message">How can we help?</label>
            <textarea id="message" name="message" rows="6" required></textarea>
          </div>
          <button class="btn btn-primary" type="submit">Send message</button>
          <p class="form-note" role="status" data-form-note hidden></p>
        </form>

        <p class="alt-contact">
          Or email us directly at
          <a href="mailto:hello@example.com">hello@example.com</a>.
        </p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-inner">
      <p>&copy; <span data-year></span> My Business. All rights reserved.</p>
      <nav class="footer-nav">
        <a href="services.html">Services</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="assets/js/main.js"></script>
</body>
</html>
