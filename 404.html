<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Business — Page not found</title>
  <!--
    Paths here are root-relative on purpose. GitHub Pages serves this file for
    ANY missing URL, including deep ones like /my-business/a/b/c — and relative
    paths would resolve against /a/b/ and break the styling.

    Serving from https://creativetstrategist-mark.github.io/my-business/ ?
      keep the /my-business/ prefix below.
    Moved to a custom domain (site lives at the root)?
      change both paths to "/assets/css/styles.css" and "/".
  -->
  <link rel="stylesheet" href="/my-business/assets/css/styles.css">
</head>
<body>
  <main id="main">
    <section class="page-head">
      <div class="wrap narrow">
        <h1>Page not found</h1>
        <p class="lede">That link doesn't lead anywhere. Try the homepage instead.</p>
        <p><a class="btn btn-primary" href="/my-business/">Back to home</a></p>
      </div>
    </section>
  </main>
</body>
</html>
