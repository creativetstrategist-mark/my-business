<script>
/* Reveal + year for any Creative Strategy Intensive embed on this page.
   Safe to include on every embed: it only ever initialises a wrapper once. */
(function(){"use strict";
  function init(){
    var boxes=document.querySelectorAll(".csi:not([data-csi])");
    if(!boxes.length)return;
    var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    Array.prototype.forEach.call(boxes,function(box){
      box.setAttribute("data-csi","1");
      var y=box.querySelector("[data-year]");
      if(y)y.textContent=String(new Date().getFullYear());
      if(reduce||!("IntersectionObserver" in window))return;
      box.classList.add("js");
      var items=Array.prototype.slice.call(box.querySelectorAll(".reveal"));
      var fold=window.innerHeight*1.05;
      items.forEach(function(el){if(el.getBoundingClientRect().top<fold)el.classList.add("is-in");});
      var io=new IntersectionObserver(function(es){es.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add("is-in");io.unobserve(e.target);}});},
        {rootMargin:"0px 0px -10% 0px",threshold:.05});
      items.forEach(function(el){if(!el.classList.contains("is-in"))io.observe(el);});
      setTimeout(function(){items.forEach(function(el){el.classList.add("is-in");});},900);
    });
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init);else init();
})();
</script>
